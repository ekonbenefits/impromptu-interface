name: build

on:
  # Pushes only on master: a branch with a PR open is covered by pull_request, and listening
  # to both ran every PR twice. A branch with no PR gets no run, which is the trade.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight, rather than queueing behind it.
# Never on master, where each commit's own run is what the badges and the site are built from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Warnings are errors in CI only, so a local build stays workable.
  CI: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the tags to compute the version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # The 10 SDK builds every leg, including net8.0 and net47.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build ImpromptuInterface.sln --configuration Release

      # Run the test executables directly rather than through `dotnet test`: AnyUnit's
      # Microsoft.Testing.Platform adapter makes each one an exe, and that is what takes
      # --report-anyunit-json. net47 needs the .NET Framework, so that leg is Windows only.
      - name: Test
        shell: bash
        run: |
          set -e
          out=results/${{ matrix.os }}
          mkdir -p "$out"
          base=Tests/UnitTestImpromptuInterface/bin/Release
          dotnet $base/net8.0/UnitTestImpromptuInterface.dll  --report-anyunit-json "$out/net8.0.json"
          dotnet $base/net10.0/UnitTestImpromptuInterface.dll --report-anyunit-json "$out/net10.0.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$base/net47/UnitTestImpromptuInterface.exe" --report-anyunit-json "$out/net47.json"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: results/**/*.json

      - name: Benchmarks build only
        run: dotnet build Benchmarks/Benchmarks.csproj --configuration Release

  # The same tests as a browser-wasm build, run under bun. Its own job: it needs the
  # wasm-tools workload and a JS runtime, and one platform is enough to know the proxy
  # emit still works there.
  wasm:
    name: browser-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: oven-sh/setup-bun@v2

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build Tests/UnitTestImpromptuInterface.Wasm --configuration Release

      - name: Test
        working-directory: Tests/UnitTestImpromptuInterface.Wasm/bin/Release/net10.0-browser/wwwroot
        run: bun runtests.mjs --report-anyunit-json "$GITHUB_WORKSPACE/results/browser-wasm/wasm.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-browser-wasm
          path: results/**/*.json

  # One table across every platform's results, in the run's summary, plus an HTML report
  # to download. anyunit-report is AnyUnit's own results converter.
  summary:
    name: test summary
    needs: [build, wasm]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download every platform's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Render
        shell: bash
        run: |
          set -e
          dotnet tool install --global AnyUnit.Report --version 1.3.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          files=$(find results -name '*.json' | sort)
          test -n "$files"
          anyunit-report convert -f markdown -o summary.md $files
          anyunit-report convert -f html -o report.html $files
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html

  # The same reports, rendered and linkable. An artifact is a zip behind an authenticated
  # download, so it cannot be linked from the readme; Pages can. Master only, and the site is
  # public, which is what a public repository's CI output already is.
  pages:
    name: publish reports
    needs: [summary, coverage]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: site/tests

      - uses: actions/download-artifact@v4
        with:
          name: coverage-site
          path: site/coverage

      - name: Landing page
        shell: bash
        run: |
          mv site/tests/report.html site/tests/index.html
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ImpromptuInterface — CI reports</title>
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; margin: 4rem auto; max-width: 40rem; padding: 0 1rem; }
            a { color: #0366d6; }
          </style>
          <h1>ImpromptuInterface — CI reports</h1>
          <p>Generated by the latest <a href="https://github.com/ekonbenefits/impromptu-interface/actions/workflows/build.yml?query=branch%3Amaster">master build</a>.</p>
          <ul>
            <li><a href="tests/">Test results</a> — every platform: net8.0, net10.0, net47 and browser-wasm</li>
            <li><a href="coverage/">Coverage</a> — line and branch, for the library</li>
          </ul>
          <p><a href="https://github.com/ekonbenefits/impromptu-interface">Back to the repository</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Line and branch coverage of the library, through coverlet's MTP extension - the test exe
  # instruments itself, so there is no external collector. Restricted to the library, since
  # coverlet will instrument anything it can find sources for.
  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Tests/UnitTestImpromptuInterface/UnitTestImpromptuInterface.csproj --configuration Release --framework net10.0

      - name: Test with coverage
        run: |
          dotnet Tests/UnitTestImpromptuInterface/bin/Release/net10.0/UnitTestImpromptuInterface.dll \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include '[ImpromptuInterface]*' \
            --results-directory coverage

      - name: Summarise
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:'coverage/coverage.cobertura.*.xml' -targetdir:coverage/report \
            -reporttypes:'Cobertura;MarkdownSummaryGithub;Html'
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/report/Cobertura.xml

      - name: Upload the browsable coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-site
          path: coverage/report

  # After a green master run, rewrite the README's test and coverage badges from that run's own
  # numbers, and commit only if one changed. [skip ci] so the badge commit starts no new run.
  # No external badge service and no GitHub Pages: the shields URLs are static text in the
  # README, and this edits them.
  badges:
    name: badges
    needs: [build, wasm, coverage]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: results-ubuntu-latest
          path: results

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Rewrite badges
        shell: bash
        run: |
          set -e
          tests=$(python3 - <<'PY'
          import json, glob
          d = json.load(open(glob.glob('results/**/net10.0.json', recursive=True)[0]))
          print(sum(1 for a in d['Assemblies'] for f in a['Fixtures'] for t in f['Tests']
                      for r in t['Results'] if r['Kind'] == 'Success'))
          PY
          )
          read line branch < <(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = ET.parse(glob.glob('coverage/**/Cobertura.xml', recursive=True)[0]).getroot()
          print(round(float(t.get('line-rate')) * 100), round(float(t.get('branch-rate')) * 100))
          PY
          )
          color() { if [ "$1" -ge 90 ]; then echo brightgreen; elif [ "$1" -ge 75 ]; then echo green; else echo yellow; fi; }
          sed -i -E "s|tests-[0-9]+%20passed-[a-z]+|tests-${tests}%20passed-brightgreen|" Readme.md
          sed -i -E "s|line%20coverage-[0-9]+%25-[a-z]+|line%20coverage-${line}%25-$(color $line)|" Readme.md
          sed -i -E "s|branch%20coverage-[0-9]+%25-[a-z]+|branch%20coverage-${branch}%25-$(color $branch)|" Readme.md
          git diff --quiet Readme.md && { echo "badges unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Readme: badges from the latest master run (${tests} tests, ${line}% line, ${branch}% branch) [skip ci]"
          git push

  publish:
    name: publish prerelease
    needs: [build, wasm]
    # Also on a v* tag, where the push to GitHub Packages is a no-op against an existing
    # version but the packed artifact is what release.yml then sends to nuget.org.
    if: >-
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ImpromptuInterface/ImpromptuInterface.csproj --configuration Release --output packages

      - name: Push to GitHub Packages
        run: dotnet nuget push 'packages/*.nupkg' --source https://nuget.pkg.github.com/ekonbenefits/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # release.yml republishes exactly these to nuget.org when the commit is tagged, rather
      # than packing again, so what ships is the artifact this run's tests passed against.
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages/*.nupkg
