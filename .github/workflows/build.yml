name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Warnings are errors in CI only, so a local build stays workable.
  CI: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the tags to compute the version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # The 10 SDK builds every leg, including net8.0 and net47.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build ImpromptuInterface.sln --configuration Release

      # Run the test executables directly rather than through `dotnet test`: AnyUnit's
      # Microsoft.Testing.Platform adapter makes each one an exe, and that is what takes
      # --report-anyunit-json. net47 needs the .NET Framework, so that leg is Windows only.
      - name: Test
        shell: bash
        run: |
          set -e
          out=results/${{ matrix.os }}
          mkdir -p "$out"
          base=Tests/UnitTestImpromptuInterface/bin/Release
          dotnet $base/net8.0/UnitTestImpromptuInterface.dll  --report-anyunit-json "$out/net8.0.json"
          dotnet $base/net10.0/UnitTestImpromptuInterface.dll --report-anyunit-json "$out/net10.0.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$base/net47/UnitTestImpromptuInterface.exe" --report-anyunit-json "$out/net47.json"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: results/**/*.json

      - name: Benchmarks build only
        run: dotnet build Benchmarks/Benchmarks.csproj --configuration Release

  # The same tests as a browser-wasm build, run under bun. Its own job: it needs the
  # wasm-tools workload and a JS runtime, and one platform is enough to know the proxy
  # emit still works there.
  wasm:
    name: browser-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: oven-sh/setup-bun@v2

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build Tests/UnitTestImpromptuInterface.Wasm --configuration Release

      - name: Test
        working-directory: Tests/UnitTestImpromptuInterface.Wasm/bin/Release/net10.0-browser/wwwroot
        run: bun runtests.mjs --report-anyunit-json "$GITHUB_WORKSPACE/results/browser-wasm/wasm.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-browser-wasm
          path: results/**/*.json

  # One table across every platform's results, in the run's summary, plus an HTML report
  # to download. anyunit-report is AnyUnit's own results converter.
  summary:
    name: test summary
    needs: [build, wasm]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download every platform's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Render
        shell: bash
        run: |
          set -e
          dotnet tool install --global AnyUnit.Report --version 1.3.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          files=$(find results -name '*.json' | sort)
          test -n "$files"
          anyunit-report convert -f markdown -o summary.md $files
          anyunit-report convert -f html -o report.html $files
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html

  # Line and branch coverage of the library, through coverlet's MTP extension - the test exe
  # instruments itself, so there is no external collector. Restricted to the library, since
  # coverlet will instrument anything it can find sources for.
  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Tests/UnitTestImpromptuInterface/UnitTestImpromptuInterface.csproj --configuration Release --framework net10.0

      - name: Test with coverage
        run: |
          dotnet Tests/UnitTestImpromptuInterface/bin/Release/net10.0/UnitTestImpromptuInterface.dll \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include '[ImpromptuInterface]*' \
            --results-directory coverage

      - name: Summarise
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:'coverage/coverage.cobertura.*.xml' -targetdir:coverage/report \
            -reporttypes:'Cobertura;MarkdownSummaryGithub'
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/report/Cobertura.xml

  publish:
    name: publish prerelease
    needs: [build, wasm]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ImpromptuInterface/ImpromptuInterface.csproj --configuration Release --output packages

      - name: Push to GitHub Packages
        run: dotnet nuget push 'packages/*.nupkg' --source https://nuget.pkg.github.com/ekonbenefits/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
