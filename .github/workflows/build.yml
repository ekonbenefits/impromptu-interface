name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Warnings are errors in CI only, so a local build stays workable.
  CI: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the tags to compute the version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # The 10 SDK builds every leg, including net8.0 and net47.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build ImpromptuInterface.sln --configuration Release

      # net47 needs the .NET Framework, so that leg only runs on Windows;
      # elsewhere the net8.0 leg stands for the library.
      - name: Test (net8.0)
        run: dotnet test Tests/UnitTestImpromptuInterface/UnitTestImpromptuInterface.csproj --configuration Release --no-build --framework net8.0

      - name: Test (net10.0)
        run: dotnet test Tests/UnitTestImpromptuInterface/UnitTestImpromptuInterface.csproj --configuration Release --no-build --framework net10.0

      - name: Test (net47, Windows only)
        if: runner.os == 'Windows'
        run: dotnet test Tests/UnitTestImpromptuInterface/UnitTestImpromptuInterface.csproj --configuration Release --no-build --framework net47

      - name: Benchmarks build only
        run: dotnet build Benchmarks/Benchmarks.csproj --configuration Release

  # The same tests as a browser-wasm build, run under bun. Its own job: it needs the
  # wasm-tools workload and a JS runtime, and one platform is enough to know the proxy
  # emit still works there.
  wasm:
    name: browser-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: oven-sh/setup-bun@v2

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build Tests/UnitTestImpromptuInterface.Wasm --configuration Release

      - name: Test
        working-directory: Tests/UnitTestImpromptuInterface.Wasm/bin/Release/net10.0-browser/wwwroot
        run: bun runtests.mjs

  publish:
    name: publish prerelease
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ImpromptuInterface/ImpromptuInterface.csproj --configuration Release --output packages

      - name: Push to GitHub Packages
        run: dotnet nuget push 'packages/*.nupkg' --source https://nuget.pkg.github.com/ekonbenefits/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
